[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlab-local"
version = "0.1.0"
description = "A cross-platform local agent runtime with configurable models, skills, and MCP servers."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
agentlab = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

