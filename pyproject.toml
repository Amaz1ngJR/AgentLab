[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlab-local"
dynamic = ["version", "dependencies"]
description = "A cross-platform local agent runtime with configurable models, skills, and MCP servers."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
agentlab = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: isolated behavior and component contract tests",
    "integration: offline cross-component, SQLite, or real Git workflow tests",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.setuptools.dynamic]
version = { attr = "app.version.__version__" }
dependencies = { file = ["requirements.txt"] }

