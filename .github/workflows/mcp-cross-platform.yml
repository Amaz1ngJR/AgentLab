name: MCP Cross-platform

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mcp-cross-platform.yml"
      - "app/mcp/**"
      - "config/mcp_servers.example.yaml"
      - "requirements.txt"
      - "tests/unit/test_mcp_*.py"
  pull_request:
    paths:
      - ".github/workflows/mcp-cross-platform.yml"
      - "app/mcp/**"
      - "config/mcp_servers.example.yaml"
      - "requirements.txt"
      - "tests/unit/test_mcp_*.py"

jobs:
  mcp-tests:
    name: MCP / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify npx command resolution
        run: python -c "from app.mcp.manager import _resolve_stdio_command; print(_resolve_stdio_command('npx'))"

      - name: Run MCP tests
        run: >-
          python -m pytest
          tests/unit/test_mcp_config.py
          tests/unit/test_mcp_manager.py
          tests/unit/test_mcp_adapter.py
          -q
