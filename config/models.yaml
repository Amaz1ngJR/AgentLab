# config/models.yaml —— 模型 profile 注册表
#
# 每个 profile 是一个命名配置，包含 provider、模型 ID、端点、凭据引用和能力声明。
# 启动时用 --profile <name> 或 ACTIVE_PROFILE=<name> 选择。
# 不指定 profile 时，程序回退到 .env 里的 LLM_* 变量（向后兼容）。
#
# 凭据规则：
#   api_key_env / auth_token_env / base_url_env 填环境变量名，不填真实值。
#   真实值放在 .env 或系统 Keyring，不入库。
#
# 模型 ID 支持 ${ENV_VAR:-default} 语法。

models:

  # ── 本地模型（Ollama）────────────────────────────────────────────────────────
  local_qwen:
    provider: ollama
    model: qwen2.5-coder:7b-instruct
    base_url: http://127.0.0.1:11434/v1
    capabilities: [chat, tools]
    params:
      temperature: 0.2
      context_size: 8192

  local_qwen14b:
    provider: ollama
    model: qwen2.5-coder:14b-instruct
    base_url: http://127.0.0.1:11434/v1
    capabilities: [chat, tools]
    params:
      temperature: 0.2
      context_size: 8192

  local_deepseek:
    provider: ollama
    model: deepseek-r1:7b
    base_url: http://127.0.0.1:11434/v1
    capabilities: [chat]
    params:
      temperature: 0.6
      context_size: 8192

  # 局域网 GPU 主机（5060Ti）：把 base_url 改成主机 IP
  lan_qwen:
    provider: ollama
    model: qwen2.5-coder:7b-instruct
    base_url: http://192.168.1.20:11434/v1
    capabilities: [chat, tools]
    params:
      temperature: 0.2
      context_size: 8192

  # ── 云端模型（Anthropic Claude）──────────────────────────────────────────────
  # 凭据从环境变量读取，不写在这里。
  # 走自建代理时设置 ANTHROPIC_AUTH_TOKEN + ANTHROPIC_BASE_URL；
  # 直连官方时设置 ANTHROPIC_API_KEY。
  cloud_claude:
    provider: anthropic
    model: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    auth_token_env: ANTHROPIC_AUTH_TOKEN
    api_key_env: ANTHROPIC_API_KEY
    base_url_env: ANTHROPIC_BASE_URL
    capabilities: [chat, tools]
    params:
      temperature: 0.2

  cloud_claude_opus:
    provider: anthropic
    model: ${ANTHROPIC_MODEL:-claude-opus-4-8}
    auth_token_env: ANTHROPIC_AUTH_TOKEN
    api_key_env: ANTHROPIC_API_KEY
    base_url_env: ANTHROPIC_BASE_URL
    capabilities: [chat, tools]
    params:
      temperature: 0.2
