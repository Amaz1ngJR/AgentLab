# config/agents.yaml —— Agent Profile 注册表
#
# 每个 profile 定义一个 Agent 实例的静态配置。
# 启动后用 /session new <agent_id> 创建该 Agent 的会话。
# 文件不存在时程序照常启动（使用默认 Agent）。
#
# memory_policy:
#   none        - 不使用长期记忆（默认，最安全）
#   read        - 会话开始时检索相关记忆注入上下文，不写入
#   read_write  - 会话结束时将摘要写入记忆，下次可检索

# orchestrate:
#   true  - 使用 Planner + Executor + Replanner 编排（默认）
#   false - 使用传统单轮模型/工具循环
#
# max_steps / max_task_steps:
#   max_steps      - 一次用户 run 的模型往返总预算
#   max_task_steps - 单个 Planner 子任务的模型往返上限

agents:

  # 默认通用助手（不写 agents.yaml 时的默认行为）
  default:
    name: 默认助手
    model_profile: cloud_claude_opus
    memory_policy: none
    orchestrate: true
    # max_steps 是一次用户 run 的模型往返总预算（保留旧名称兼容已有配置），
    # max_task_steps 是单个 Planner 子任务最多允许的模型往返次数。
    max_steps: 16
    max_task_steps: 8

  # 代码助手——专注于代码阅读、搜索和修改
  coder:
    name: 代码助手
    model_profile: cloud_claude
    system_prompt: |
      你是一个专注于代码的助手。优先用 code_search 定位代码，read_file 精读，
      shell 运行测试。写代码简洁优先，改动最小化，不要过度重构。
    tools: []          # 空列表 = 使用全部内置工具
    skills: [code-review]   # 显式启用的 Skill;只注入工作流上下文,不授予工具权限
    memory_policy: read_write
    orchestrate: true
    max_steps: 100
    max_task_steps: 50

  # 本地轻量助手——使用本地模型，不发数据到云端
  local:
    name: 本地助手
    model_profile: local_qwen
    memory_policy: none
    orchestrate: true
    max_steps: 16
    max_task_steps: 8
